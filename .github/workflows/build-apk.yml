name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - run: python -m pytest -q

  apk:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev autopoint gettext

      - name: Instalar Buildozer
        run: |
          pip install git+https://github.com/kivy/buildozer
          pip install legacy-cgi setuptools "cython==0.29.34"

      # Guarda el SDK/NDK y lo ya compilado: la 1.ª vez tarda ~30 min, luego mucho menos.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Firma siempre con la misma llave: así cada versión se instala encima de la anterior
      # (llave de depuración, no secreta; para Play Store se usaría una llave de publicación).
      - name: Llave de firma fija
        run: |
          mkdir -p ~/.android
          cp .github/keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK (debug)
        run: buildozer android debug

      - name: Comprobar firma del APK
        run: |
          echo "Llave fija:"; keytool -list -v -keystore .github/keystore/debug.keystore -storepass android | grep "SHA256:"
          echo "APK:"; keytool -printcert -jarfile bin/*.apk | grep "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: mi-router-apk
          path: bin/*.apk
          if-no-files-found: error
